<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h2>Sales Dashboard</h2>

    <div>

        <input type="date" id="reportDate">

    </div>

</header>


<div class="cards">

    <div class="card dark">
        <p>Today's Sales</p>
        <h1 id="todaySales">--</h1>
    </div>

    <div class="card">
        <p>Today's Revenue</p>
        <h2 id="todayRevenue">--</h2>
    </div>

    <div class="card">
        <p>MTD Sales</p>
        <h2 id="mtdSales">--</h2>
    </div>

    <div class="card">
        <p>MTD Revenue</p>
        <h2 id="mtdRevenue">--</h2>
    </div>

</div>


<div class="content">

    <div class="table-box">

        <h3>Leaderboard</h3>

        <table>

            <thead>

                <tr>

                    <th>Representative</th>
                    <th>Today</th>
                    <th>MTD</th>
                    <th>Revenue</th>

                </tr>

            </thead>

            <tbody id="leaderboard"></tbody>

        </table>

    </div>

    <div class="side">

        <h3>Monthly Sales</h3>

        <div id="monthlyList"></div>

    </div>

</div>


<div class="daily">

    <h3>Daily Metrics</h3>

    <table>

        <thead>

        <tr>

            <th>Date</th>
            <th>Sales</th>
            <th>Revenue</th>

        </tr>

        </thead>

        <tbody id="dailyTable"></tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
